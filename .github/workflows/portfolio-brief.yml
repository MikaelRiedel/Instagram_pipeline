name: Portfolio - morning brief

# Runs after the other loops have finished, walks every project in
# portfolio/projects.yml, and writes one brief meant to be read aloud.
on:
  schedule:
    - cron: "11 6 * * *"   # 06:11 UTC = 09:11 Finnish, after stats/critique/build
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/portfolio_brief.py
      - name: Commit the brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs/
          git diff --staged --quiet || git commit -m "morning brief"
          git pull --rebase --autostash -q || true
          git push
