name: Daily Instagram content

on:
  schedule:
    # 09:00 UTC = 12:00 Finnish time, two hours before the 14:00 Buffer
    # posting slot. Cron is always UTC and does not follow Finnish DST.
    - cron: "0 9 * * *"
  # Lets you trigger a run on demand from the Actions tab, without waiting
  # for the schedule -- useful for testing.
  workflow_dispatch: {}

permissions:
  contents: write  # needed so the workflow can commit/push new posts + history.json

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # Hard ceiling. A normal run is ~10 min; anything past 15 is stuck, and a
    # stuck run costs real money in retried API calls. Fail loudly instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate today's content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_content.py

      - name: Queue post in Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python3 publish_to_buffer.py
