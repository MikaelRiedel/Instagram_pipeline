name: Daily Instagram content

on:
  schedule:
    # 05:17 UTC = 08:17 Finnish, ~5h45m before the 14:00 Buffer slot.
    # Two deliberate choices here:
    #  - Very early, because GitHub's scheduled runs are best-effort. The
    #    2026-09-16 run fired 4h48m late, missing that day's posting slot.
    #  - An odd minute, not :00, since on-the-hour schedules queue behind
    #    everyone else's cron and are delayed the most.
    # Cron is always UTC and does not follow Finnish DST.
    - cron: "17 5 * * *"
  # Manual runs from the Actions tab. Untick "publish" to test the whole
  # generation step without anything reaching Buffer or Instagram.
  workflow_dispatch:
    inputs:
      publish:
        description: "Queue the post in Buffer (untick for a safe test run)"
        type: boolean
        default: true

permissions:
  contents: write  # needed so the workflow can commit/push new posts + history.json

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # Hard ceiling. A normal run is ~10 min; anything past 15 is stuck, and a
    # stuck run costs real money in retried API calls. Fail loudly instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate today's content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional -- without it, photo slides fall back to graphics
          # rather than failing the run.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 generate_content.py

      # Always keep the rendered slides as a downloadable artifact, so a test
      # run (or a failed one) can be inspected without it being published.
      - name: Save generated post
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-post
          path: posts/
          if-no-files-found: ignore

      - name: Queue post in Buffer
        # Scheduled runs always publish; manual runs only when ticked.
        if: github.event_name == 'schedule' || inputs.publish
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python3 publish_to_buffer.py
