name: Check available metrics

# Manual only. Answers one question: which engagement metrics does Buffer
# hand back for our published Instagram posts on the current plan? The
# stats loop's design depends on it.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe Buffer metrics
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python3 check_metrics.py
