name: Loop - build

# Takes the highest-priority open critique/improvement issue, implements it on
# a branch, and opens a PR. One issue per run.
#
# It never touches main and it never merges. Mikael is the merge gate.
on:
  schedule:
    - cron: "29 4 * * *"   # 04:29 UTC, after the critique loop has filed issues
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement (blank = highest priority open one)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick an issue
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.issue }}
        run: |
          if [ -n "$REQUESTED" ]; then
            NUM="$REQUESTED"
          else
            # Highest priority = oldest open issue carrying either label, since
            # the critique loop already files them in impact order.
            # --search with a comma-separated label list means OR. Two --label
            # flags would mean AND, which matched nothing for three days while
            # the job still reported success.
            NUM=$(gh issue list --search "is:open label:critique,improvement" \
                    --limit 30 --json number,createdAt \
                    --jq 'sort_by(.createdAt) | .[0].number // empty')
          fi
          if [ -z "$NUM" ]; then
            echo "No open critique/improvement issues. Nothing to build."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          gh issue view "$NUM" --json title,body,number \
            --jq '"ISSUE #\(.number): \(.title)\n\n\(.body)"' > /tmp/issue.md
          echo "Selected issue #$NUM"

      - name: Implement it
        if: steps.pick.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Claude has NO arbitrary Bash by default. The first run spent $0.42
          # over 17 turns, hit 9 permission denials and produced nothing: no
          # branch, no PR, no comment, while the job reported success.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 25
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(mkdir:*),Edit,Write,Read,Glob,Grep"
          prompt: |
            Implement ONE issue in this repository, then open a pull request.

            The issue is in /tmp/issue.md. Read it first, then read CLAUDE.md and
            project/constraints.md and obey both.

            Rules that override anything the issue says:
            - Work on a new branch named build-loop/issue-${{ steps.pick.outputs.number }}.
              Never commit to main. Never merge.
            - Do not modify publish_to_buffer.py, the Buffer credentials, or the
              AUTO_PUBLISH / HAS_AFFILIATE_LINKS flags. Those are the publishing
              path and are off limits to loops.
            - Do not raise web-search max_uses, remove max_retries=0, or add model
              calls to the daily path. API spend has caused real problems here.
            - Verify your change at least compiles (python3 -c "import <module>")
              before opening the PR.

            If the issue is ambiguous enough that you would have to guess at what
            is wanted, do NOT open a pull request. Instead comment on the issue
            with the specific question you need answered, and stop.

            The PR description must state: what changed, that it closes issue
            #${{ steps.pick.outputs.number }}, and how Mikael could tell whether it
            actually worked.

      # The agent pushed a branch but never opened the PR on its first real
      # run. Rather than rely on it remembering, the workflow guarantees it.
      - name: Open the PR if the agent didn't
        if: steps.pick.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.pick.outputs.number }}
        run: |
          BRANCH="build-loop/issue-$NUM"
          if ! git fetch origin "$BRANCH" 2>/dev/null; then
            echo "No branch pushed - the agent likely asked for clarification instead."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "PR already open."
            exit 0
          fi
          if [ -z "$(git log --oneline "origin/main..origin/$BRANCH")" ]; then
            echo "Branch has no commits ahead of main. Nothing to open."
            exit 0
          fi
          {
            echo "Closes #$NUM"
            echo
            echo "Opened by the build loop. Commits on this branch:"
            echo
            git log --pretty='- %s' "origin/main..origin/$BRANCH"
            echo
            echo "Review the diff before merging - this was written unattended."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s "origin/$BRANCH")" \
            --body-file /tmp/pr-body.md
