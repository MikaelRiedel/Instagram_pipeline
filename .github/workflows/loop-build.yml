name: Loop - build

# Takes the highest-priority open critique/improvement issue, implements it on
# a branch, and opens a PR. One issue per run.
#
# It never touches main and it never merges. Mikael is the merge gate.
on:
  schedule:
    - cron: "29 4 * * *"   # 04:29 UTC, after the critique loop has filed issues
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement (blank = highest priority open one)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick an issue
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.issue }}
        run: |
          if [ -n "$REQUESTED" ]; then
            NUM="$REQUESTED"
          else
            # Highest priority = oldest open issue carrying either label, since
            # the critique loop already files them in impact order.
            NUM=$(gh issue list --label critique --label improvement \
                    --state open --limit 20 --json number,createdAt \
                    --jq 'sort_by(.createdAt) | .[0].number // empty')
          fi
          if [ -z "$NUM" ]; then
            echo "No open critique/improvement issues. Nothing to build."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          gh issue view "$NUM" --json title,body,number \
            --jq '"ISSUE #\(.number): \(.title)\n\n\(.body)"' > /tmp/issue.md
          echo "Selected issue #$NUM"

      - name: Implement it
        if: steps.pick.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Implement ONE issue in this repository, then open a pull request.

            The issue is in /tmp/issue.md. Read it first, then read CLAUDE.md and
            project/constraints.md and obey both.

            Rules that override anything the issue says:
            - Work on a new branch named build-loop/issue-${{ steps.pick.outputs.number }}.
              Never commit to main. Never merge.
            - Do not modify publish_to_buffer.py, the Buffer credentials, or the
              AUTO_PUBLISH / HAS_AFFILIATE_LINKS flags. Those are the publishing
              path and are off limits to loops.
            - Do not raise web-search max_uses, remove max_retries=0, or add model
              calls to the daily path. API spend has caused real problems here.
            - Verify your change at least compiles (python3 -c "import <module>")
              before opening the PR.

            If the issue is ambiguous enough that you would have to guess at what
            is wanted, do NOT open a pull request. Instead comment on the issue
            with the specific question you need answered, and stop.

            The PR description must state: what changed, that it closes issue
            #${{ steps.pick.outputs.number }}, and how Mikael could tell whether it
            actually worked.
